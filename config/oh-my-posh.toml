"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true

pwd = "osc7"

[upgrade]
notice = true
interval = "24h"
auto = false
source = "cdn"

# Block 1: execution time + git + languages + battery
# Powerline symbols matching original config:
#    = separator (same glyph used for both powerline_symbol and leading_powerline_symbol)
[[blocks]]
alignment = "left"
newline = true
type = "prompt"

  [[blocks.segments]]
  type = "executiontime"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#1A2330"
  foreground = "#9FACBA"
  template = " 󱤦 {{ .FormattedMs }} "
  [blocks.segments.options]
  style = "austin"
  threshold = 150

  [[blocks.segments]]
  type = "git"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#1E2A35"
  foreground = "#6EA89E"
  foreground_templates = [
    "{{ if or (.Working.Changed) (.Staging.Changed) }}#F09558{{ end }}",
    "{{ if and (gt .Ahead 0) (gt .Behind 0) }}#F58A8A{{ end }}",
    "{{ if gt .Ahead 0 }}#9DD062{{ end }}",
    "{{ if gt .Behind 0 }}#9DD062{{ end }}"
  ]
  template = " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} "
  [blocks.segments.options]
  branch_template = "{{ trunc 25 .Branch }}"
  fetch_status = true
  fetch_upstream_icon = true

  [[blocks.segments]]
  type = "python"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#222F3D"
  foreground = "#E8BC1E"
  template = "  {{ if .Error }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }} {{ end }}"
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "go"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#263442"
  foreground = "#5DC0CC"
  template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }} {{ end }}"
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "node"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#2A3944"
  foreground = "#94C45C"
  template = " {{ if .PackageManagerIcon }}{{ .PackageManagerIcon }} {{ end }}{{ .Full }} "
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "ruby"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#2D3E45"
  foreground = "#F58A8A"
  template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }} {{ end }}"
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "java"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#304146"
  foreground = "#F09558"
  template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }} {{ end }}"
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "julia"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#334445"
  foreground = "#C89EE0"
  template = " {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }} {{ end }} "
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "php"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#364644"
  foreground = "#AAB2DC"
  template = " {{ .Full }} "
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "dotnet"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#394844"
  foreground = "#C5AEE6"
  template = " .NET {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }} {{ end }}"
  [blocks.segments.options]
  fetch_version = true

  [[blocks.segments]]
  type = "battery"
  style = "powerline"
  powerline_symbol = ""
  leading_powerline_symbol = ""
  background = "#3D4A44"
  foreground = "#D8DED8"
  foreground_templates = [
    "{{if eq \"Charging\" .State.String}}#5DC0CC{{end}}",
    "{{if eq \"Discharging\" .State.String}}#F58A8A{{end}}",
    "{{if eq \"Full\" .State.String}}#94C45C{{end}}"
  ]
  template = " {{ if not .Error }}{{ .Icon }} {{ .Percentage }}{{ end }}{{ .Error }} "
  [blocks.segments.options]
  charged_icon = ""
  charging_icon = ""
  discharging_icon = " "


# Block 2: root (when applicable) + username + path
[[blocks]]
alignment = "left"
newline = true
type = "prompt"

  [[blocks.segments]]
  type = "root"
  style = "powerline"
  powerline_symbol = ""
  background = "#6B1F1F"
  foreground = "#FFCFCF"
  template = "  ROOT "

  [[blocks.segments]]
  type = "text"
  style = "powerline"
  powerline_symbol = ""
  background = "#29315A"
  foreground = "#E64747"
  template = "  {{ .UserName }} "

  [[blocks.segments]]
  type = "path"
  style = "powerline"
  powerline_symbol = ""
  background = "#3D4B76"
  foreground = "#3EC669"
  template = "  {{ .Path }} ❯ "
  [blocks.segments.options]
  style = "agnoster"
